name: Detect GitHub Spam Accounts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      apply-blocks:
        description: Execute real block operations
        required: false
        default: false
        type: boolean
      detection-sensitivity:
        description: Detection sensitivity
        required: false
        default: balanced
        type: choice
        options:
          - aggressive
          - balanced
          - conservative
      target-type:
        description: Which social graph to scan
        required: false
        default: followers
        type: choice
        options:
          - followers
          - following
          - both
      custom-keywords:
        description: Optional comma or newline separated spam keywords
        required: false
        default: ""
        type: string
      exclude-users:
        description: Optional comma or newline separated logins to skip
        required: false
        default: ""
        type: string
      delay-ms:
        description: Delay between block requests in milliseconds
        required: false
        default: "750"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spam-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Validate spam blocker token
        env:
          SPAM_BLOCKER_TOKEN: ${{ secrets.SPAM_BLOCKER_TOKEN }}
        run: |
          if [ -z "$SPAM_BLOCKER_TOKEN" ]; then
            echo "Missing repository secret: SPAM_BLOCKER_TOKEN"
            echo "Use a classic PAT with user scope or a fine-grained PAT with Followers read and Block another user write permissions."
            exit 1
          fi

      - name: Run spam blocker
        id: spam-blocker
        uses: sametcn99/gh-block-spam-accounts@1.2
        with:
          github-token: ${{ secrets.SPAM_BLOCKER_TOKEN }}
          detection-sensitivity: ${{ github.event_name == 'workflow_dispatch' && inputs['detection-sensitivity'] || 'balanced' }}
          target-type: ${{ github.event_name == 'workflow_dispatch' && inputs['target-type'] || 'followers' }}
          custom-keywords: ${{ github.event_name == 'workflow_dispatch' && inputs['custom-keywords'] || '' }}
          exclude-users: ${{ github.event_name == 'workflow_dispatch' && inputs['exclude-users'] || '' }}
          apply-blocks: ${{ github.event_name == 'workflow_dispatch' && inputs['apply-blocks'] || false }}
          delay-ms: ${{ github.event_name == 'workflow_dispatch' && inputs['delay-ms'] || '750' }}
